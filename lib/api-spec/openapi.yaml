openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Him For You discovery and membership API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: discovery
    description: Public profile discovery
  - name: engagement
    description: Public interest and favourite actions
  - name: membership
    description: Membership and city metadata
paths:
  /registration/admin/registrations:
    {
      "get":
        {
          "operationId": "listAdminRegistrations",
          "tags": ["registration"],
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "array",
                              "items":
                                {
                                  "$ref": "#/components/schemas/RegistrationRecord",
                                },
                            },
                        },
                    },
                },
            },
        },
    }
  /registration/admin/registrations/{id}/review:
    {
      "post":
        {
          "operationId": "reviewRegistration",
          "tags": ["registration"],
          "parameters":
            [
              {
                "name": "id",
                "in": "path",
                "required": true,
                "schema": { "type": "string" },
              },
            ],
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        { "$ref": "#/components/schemas/RegistrationReview" },
                    },
                },
            },
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/RegistrationRecord",
                            },
                        },
                    },
                },
            },
        },
    }
  /registration/profile:
    {
      "put":
        {
          "operationId": "updateMyRegistration",
          "tags": ["registration"],
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        { "$ref": "#/components/schemas/RegistrationRecord" },
                    },
                },
            },
          "responses":
            {
              "200":
                {
                  "description": "Updated private profile",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/RegistrationRecord",
                            },
                        },
                    },
                },
            },
        },
    }
  /registration/admin/login:
    {
      "post":
        {
          "operationId": "loginRegistrationAdmin",
          "tags": ["registration"],
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "$ref": "#/components/schemas/RegistrationAdminLogin",
                        },
                    },
                },
            },
          "responses":
            {
              "200":
                {
                  "description": "Saved",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/RegistrationSettings",
                            },
                        },
                    },
                },
            },
        },
    }
  /registration/admin/settings:
    {
      "put":
        {
          "operationId": "updateRegistrationSettings",
          "tags": ["registration"],
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        { "$ref": "#/components/schemas/RegistrationSettings" },
                    },
                },
            },
          "responses":
            {
              "200":
                {
                  "description": "Saved",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/RegistrationSettings",
                            },
                        },
                    },
                },
            },
        },
    }
  /registration/settings:
    {
      "get":
        {
          "operationId": "getRegistrationSettings",
          "tags": ["registration"],
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/RegistrationSettings",
                            },
                        },
                    },
                },
            },
        },
    }
  /registrations:
    {
      "post":
        {
          "operationId": "registerProfile",
          "tags": ["registration"],
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/RegistrationRecord",
                            },
                        },
                    },
                },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        { "$ref": "#/components/schemas/RegistrationInput" },
                    },
                },
            },
        },
    }
  /registration/me:
    {
      "get":
        {
          "operationId": "getMyRegistration",
          "tags": ["registration"],
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/RegistrationRecord",
                            },
                        },
                    },
                },
            },
        },
    }
  /registration/login:
    {
      "post":
        {
          "operationId": "loginRegistration",
          "tags": ["registration"],
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/RegistrationRecord",
                            },
                        },
                    },
                },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        { "$ref": "#/components/schemas/RegistrationLogin" },
                    },
                },
            },
        },
    }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profiles:
    get:
      operationId: listProfiles
      tags: [discovery]
      summary: Browse approved male profiles
      parameters:
        - $ref: "#/components/parameters/City"
        - $ref: "#/components/parameters/LookingFor"
        - $ref: "#/components/parameters/MinAge"
        - $ref: "#/components/parameters/MaxAge"
        - $ref: "#/components/parameters/Premium"
        - $ref: "#/components/parameters/Verified"
        - $ref: "#/components/parameters/Active"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Matching profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
  /profiles/featured:
    get:
      operationId: getFeaturedProfiles
      tags: [discovery]
      summary: Get featured profiles for the homepage
      parameters:
        - $ref: "#/components/parameters/City"
      responses:
        "200":
          description: Featured profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
  /profiles/{slug}:
    get:
      operationId: getProfile
      tags: [discovery]
      summary: Get a public profile by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDetail"
        "404":
          description: Profile not found
  /profiles/{id}/interest:
    post:
      operationId: sendInterest
      tags: [engagement]
      summary: Send interest to a profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterestInput"
      responses:
        "201":
          description: Interest recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementResponse"
  /profiles/{id}/favorite:
    post:
      operationId: toggleFavorite
      tags: [engagement]
      summary: Toggle a profile favourite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Favourite state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementResponse"
  /cities:
    get:
      operationId: listCities
      tags: [membership]
      summary: List active cities
      responses:
        "200":
          description: Active cities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/City"
  /plans:
    get:
      operationId: listPlans
      tags: [membership]
      summary: List visible membership plans
      responses:
        "200":
          description: Membership plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
  /discovery-summary:
    get:
      operationId: getDiscoverySummary
      tags: [discovery]
      summary: Get homepage discovery summary
      responses:
        "200":
          description: Summary metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverySummary"
components:
  parameters:
    City:
      name: city
      in: query
      schema:
        type: string
    LookingFor:
      name: lookingFor
      in: query
      schema:
        type: string
    MinAge:
      name: minAge
      in: query
      schema:
        type: number
        minimum: 18
    MaxAge:
      name: maxAge
      in: query
      schema:
        type: number
        maximum: 100
    Premium:
      name: premium
      in: query
      schema:
        type: boolean
    Verified:
      name: verified
      in: query
      schema:
        type: boolean
    Active:
      name: active
      in: query
      schema:
        type: boolean
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [featured, active, newest, age]
        default: featured
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Profile:
      type: object
      properties:
        id:
          type: number
        slug:
          type: string
        displayName:
          type: string
        age:
          type: number
        city:
          type: string
        citySlug:
          type: string
        headline:
          type: string
        imageUrl:
          type: string
        interests:
          type: array
          items:
            type: string
        lookingFor:
          type: array
          items:
            type: string
        isVerified:
          type: boolean
        isPremium:
          type: boolean
        isFeatured:
          type: boolean
        isOnline:
          type: boolean
        lastActive:
          type: string
        favouriteCount:
          type: number
      required:
        [
          id,
          slug,
          displayName,
          age,
          city,
          citySlug,
          headline,
          imageUrl,
          interests,
          lookingFor,
          isVerified,
          isPremium,
          isFeatured,
          isOnline,
          lastActive,
          favouriteCount,
        ]
    ProfileDetail:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          properties:
            bio:
              type: string
            gallery:
              type: array
              items:
                type: string
            availability:
              type: string
            responseTime:
              type: string
          required: [bio, gallery, availability, responseTime]
    City:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
        profileCount:
          type: number
      required: [id, name, slug, profileCount]
    Plan:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        price:
          type: number
        duration:
          type: string
        description:
          type: string
        features:
          type: array
          items:
            type: string
        popular:
          type: boolean
        cta:
          type: string
      required: [id, name, price, duration, description, features, popular, cta]
    InterestInput:
      type: object
      required: [contactType, contact]
      properties:
        contactType:
          type: string
          enum: [telegram, whatsapp]
        contact:
          type: string
          minLength: 1
          maxLength: 64
        note:
          type: string
          maxLength: 500
    EngagementResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        isFavourite:
          type: boolean
      required: [success, message]
    DiscoverySummary:
      type: object
      properties:
        profileCount:
          type: number
        cityCount:
          type: number
        verifiedCount:
          type: number
        activeNowCount:
          type: number
      required: [profileCount, cityCount, verifiedCount, activeNowCount]

    RegistrationPhoto:
      {
        "type": "object",
        "properties":
          {
            "dataUrl":
              { "type": "string", "minLength": 1, "maxLength": 1500000 },
            "category":
              {
                "type": "string",
                "enum": ["profile", "additional", "gallery"],
              },
          },
        "required": ["dataUrl", "category"],
      }
    RegistrationInput:
      {
        "type": "object",
        "properties":
          {
            "displayName":
              { "type": "string", "minLength": 1, "maxLength": 80 },
            "dateOfBirth":
              { "type": "string", "minLength": 1, "maxLength": 10 },
            "email": { "type": "string", "minLength": 1, "maxLength": 254 },
            "mobile": { "type": "string", "minLength": 1, "maxLength": 25 },
            "password": { "type": "string", "minLength": 8, "maxLength": 128 },
            "confirmPassword":
              { "type": "string", "minLength": 1, "maxLength": 128 },
            "headline": { "type": "string", "minLength": 0, "maxLength": 120 },
            "about": { "type": "string", "minLength": 0, "maxLength": 2000 },
            "country": { "type": "string", "minLength": 0, "maxLength": 80 },
            "state": { "type": "string", "minLength": 0, "maxLength": 80 },
            "city": { "type": "string", "minLength": 0, "maxLength": 80 },
            "area": { "type": "string", "minLength": 0, "maxLength": 100 },
            "age": { "type": "number", "minimum": 18, "maximum": 100 },
            "pinCode": { "type": "string", "minLength": 0, "maxLength": 12 },
            "interests":
              {
                "type": "array",
                "minItems": 0,
                "maxItems": 20,
                "uniqueItems": true,
                "items": { "type": "string", "minLength": 1, "maxLength": 80 },
              },
            "languages":
              {
                "type": "array",
                "minItems": 0,
                "maxItems": 20,
                "uniqueItems": true,
                "items": { "type": "string", "minLength": 1, "maxLength": 80 },
              },
            "preferences":
              {
                "type": "array",
                "minItems": 0,
                "maxItems": 20,
                "uniqueItems": true,
                "items": { "type": "string", "minLength": 1, "maxLength": 80 },
              },
            "availability":
              {
                "type": "array",
                "minItems": 0,
                "maxItems": 20,
                "uniqueItems": true,
                "items": { "type": "string", "minLength": 1, "maxLength": 80 },
              },
            "minAge": { "type": "number", "minimum": 18, "maximum": 100 },
            "maxAge": { "type": "number", "minimum": 18, "maximum": 100 },
            "status":
              { "type": "string", "enum": ["available", "unavailable"] },
            "listing":
              {
                "type": "string",
                "enum": ["free", "weekly", "monthly", "quarterly"],
              },
            "partnerOptIn": { "type": "boolean" },
            "accurate": { "type": "boolean" },
            "terms": { "type": "boolean" },
            "adult": { "type": "boolean" },
            "photos":
              {
                "type": "array",
                "minItems": 0,
                "maxItems": 8,
                "items": { "$ref": "#/components/schemas/RegistrationPhoto" },
              },
            "mainPhoto": { "type": "number", "minimum": 0, "maximum": 7 },
          },
        "required":
          [
            "displayName",
            "dateOfBirth",
            "email",
            "mobile",
            "password",
            "confirmPassword",
            "headline",
            "about",
            "country",
            "state",
            "city",
            "area",
            "age",
            "pinCode",
            "interests",
            "languages",
            "preferences",
            "availability",
            "minAge",
            "maxAge",
            "status",
            "listing",
            "partnerOptIn",
            "accurate",
            "terms",
            "adult",
            "photos",
            "mainPhoto",
          ],
      }
    RegistrationRecord:
      {
        "type": "object",
        "properties":
          {
            "displayName":
              { "type": "string", "minLength": 1, "maxLength": 80 },
            "dateOfBirth":
              { "type": "string", "minLength": 1, "maxLength": 10 },
            "email": { "type": "string", "minLength": 1, "maxLength": 254 },
            "mobile": { "type": "string", "minLength": 1, "maxLength": 25 },
            "headline": { "type": "string", "minLength": 0, "maxLength": 120 },
            "about": { "type": "string", "minLength": 0, "maxLength": 2000 },
            "country": { "type": "string", "minLength": 0, "maxLength": 80 },
            "state": { "type": "string", "minLength": 0, "maxLength": 80 },
            "city": { "type": "string", "minLength": 0, "maxLength": 80 },
            "area": { "type": "string", "minLength": 0, "maxLength": 100 },
            "age": { "type": "number", "minimum": 18, "maximum": 100 },
            "pinCode": { "type": "string", "minLength": 0, "maxLength": 12 },
            "interests":
              {
                "type": "array",
                "minItems": 0,
                "maxItems": 20,
                "uniqueItems": true,
                "items": { "type": "string", "minLength": 1, "maxLength": 80 },
              },
            "languages":
              {
                "type": "array",
                "minItems": 0,
                "maxItems": 20,
                "uniqueItems": true,
                "items": { "type": "string", "minLength": 1, "maxLength": 80 },
              },
            "preferences":
              {
                "type": "array",
                "minItems": 0,
                "maxItems": 20,
                "uniqueItems": true,
                "items": { "type": "string", "minLength": 1, "maxLength": 80 },
              },
            "availability":
              {
                "type": "array",
                "minItems": 0,
                "maxItems": 20,
                "uniqueItems": true,
                "items": { "type": "string", "minLength": 1, "maxLength": 80 },
              },
            "minAge": { "type": "number", "minimum": 18, "maximum": 100 },
            "maxAge": { "type": "number", "minimum": 18, "maximum": 100 },
            "status":
              { "type": "string", "enum": ["available", "unavailable"] },
            "listing":
              {
                "type": "string",
                "enum": ["free", "weekly", "monthly", "quarterly"],
              },
            "partnerOptIn": { "type": "boolean" },
            "accurate": { "type": "boolean" },
            "terms": { "type": "boolean" },
            "adult": { "type": "boolean" },
            "photos":
              {
                "type": "array",
                "minItems": 0,
                "maxItems": 8,
                "items": { "$ref": "#/components/schemas/RegistrationPhoto" },
              },
            "mainPhoto": { "type": "number", "minimum": 0, "maximum": 7 },
            "id": { "type": "string", "minLength": 1, "maxLength": 120 },
            "submittedAt":
              { "type": "string", "minLength": 1, "maxLength": 120 },
            "reviewStatus":
              { "type": "string", "minLength": 1, "maxLength": 120 },
            "listingPrice": { "type": "number", "minimum": 0 },
            "isComplete": { "type": "boolean" },
            "isPublished": { "type": "boolean" },
            "missingSteps": { "type": "array", "items": { "type": "string" } },
            "notificationStatus": { "type": "string" },
            "publicSlug": { "type": "string" },
          },
        "required":
          [
            "displayName",
            "dateOfBirth",
            "email",
            "mobile",
            "headline",
            "about",
            "country",
            "state",
            "city",
            "area",
            "age",
            "pinCode",
            "interests",
            "languages",
            "preferences",
            "availability",
            "minAge",
            "maxAge",
            "status",
            "listing",
            "partnerOptIn",
            "accurate",
            "terms",
            "adult",
            "photos",
            "mainPhoto",
            "id",
            "submittedAt",
            "reviewStatus",
            "listingPrice",
          ],
      }

    RegistrationSettings:
      {
        "type": "object",
        "properties":
          {
            "plans":
              {
                "type": "array",
                "items": { "$ref": "#/components/schemas/RegistrationPlan" },
              },
            "termsUrl": { "type": "string" },
            "privacyUrl": { "type": "string" },
          },
        "required": ["plans", "termsUrl", "privacyUrl"],
      }
    RegistrationPlan:
      {
        "type": "object",
        "properties":
          {
            "id":
              { "type": "string", "enum": ["weekly", "monthly", "quarterly"] },
            "price": { "type": "number", "minimum": 0 },
            "enabled": { "type": "boolean" },
          },
        "required": ["id", "price", "enabled"],
      }
    RegistrationLogin:
      {
        "type": "object",
        "properties":
          {
            "email": { "type": "string", "minLength": 1, "maxLength": 254 },
            "password": { "type": "string", "minLength": 1, "maxLength": 128 },
          },
        "required": ["email", "password"],
      }
    RegistrationAdminLogin:
      {
        "type": "object",
        "required": ["password"],
        "properties":
          {
            "password": { "type": "string", "minLength": 1, "maxLength": 256 },
          },
      }
    RegistrationReview:
      {
        "type": "object",
        "required": ["action"],
        "properties":
          { "action": { "type": "string", "enum": ["approve", "reject"] } },
      }
